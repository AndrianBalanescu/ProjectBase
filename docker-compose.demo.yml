# Demo override: Caddy automatic-HTTPS reverse proxy.
# Used only by scripts/deploy-demo.sh --domain <demo.example.com>.
services:
  caddy:
    image: caddy:2-alpine
    container_name: projectbase-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: "${DEMO_DOMAIN:?DEMO_DOMAIN must be set}"
    command: >
      caddy run --config /etc/caddy/Caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - projectbase

volumes:
  caddy_data:
  caddy_config:
