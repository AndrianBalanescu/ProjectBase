<!DOCTYPE html>
<html lang="en" class="dark h-full bg-[#0b0f19]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectBase — Ultra-lightweight Project & Kanban Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2226%22 font-size=%2226%22>⚡</text></svg>" />
  
  <!-- Static Compiled Tailwind CSS (Tree-shaken & minified) -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- App Custom CSS & Milkdown Theme -->
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/vendor/milkdown.css" />

  <!-- Vendor JS Libraries (100% offline self-contained) -->
  <script src="/vendor/pocketbase.umd.js"></script>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/sortable.min.js"></script>
  <script src="/vendor/lucide.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/confetti.min.js"></script>
  <script src="/vendor/milkdown.js"></script>
</head>
<body class="h-full bg-[#0b0f19] text-gray-100 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">
  
  <div id="app" class="h-full flex flex-col">
    <!-- Auth Gate -->
    <div v-if="!authReady" class="h-full flex items-center justify-center bg-[#0b0f19] text-gray-400 text-sm">Loading session...</div>
    <div v-else-if="!isAuthenticated" class="h-full flex items-center justify-center bg-[#0b0f19] p-6">
      <div class="w-full max-w-sm p-6 rounded-2xl bg-gray-900 border border-gray-800 shadow-2xl">
        <div class="flex items-center space-x-2 mb-6">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">⚡</div>
          <div><h1 class="text-base font-bold text-white">ProjectBase</h1><p class="text-xs text-gray-500">Sign in to your workspace</p></div>
        </div>
        <div v-if="authMode === 'signup'">
          <form @submit.prevent="signUp" class="space-y-3">
            <input v-model="signupName" type="text" autocomplete="name" placeholder="Name (optional)" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="loginEmail" type="email" autocomplete="email" required placeholder="Email" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="loginPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Password (min 8 chars)" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="signupPasswordConfirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Confirm password" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <p v-if="authError" class="text-xs text-red-400">{{ authError }}</p>
            <button :disabled="signingUp" class="w-full px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold disabled:opacity-50">
              {{ signingUp ? 'Creating account…' : 'Create account' }}
            </button>
          </form>
          <p class="mt-4 text-[11px] text-gray-500">Already have an account?
            <button type="button" @click="authMode = 'login'" class="text-indigo-400 hover:text-indigo-300 font-semibold">Sign in</button>
          </p>
        </div>
        <form v-else @submit.prevent="signIn" class="space-y-3">
          <input v-model="loginEmail" type="email" autocomplete="email" required placeholder="Email" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
          <input v-model="loginPassword" type="password" autocomplete="current-password" required placeholder="Password" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
          <p v-if="authError" class="text-xs text-red-400">{{ authError }}</p>
          <button class="w-full px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Sign in</button>
        </form>
        <p class="mt-4 text-[11px] text-gray-500">New here?
          <button v-if="authMode === 'login'" type="button" @click="authMode = 'signup'" class="text-indigo-400 hover:text-indigo-300 font-semibold">Create a free account</button>
        </p>
        <p class="mt-2 text-[11px] text-gray-600">Public demos should create a normal user account. Never use the PocketBase superuser for daily work.</p>
      </div>
    </div>

    <template v-else>
    <header-bar 
      :projects="projects"
      :current-project="currentProject"
      :current-view="currentView"
      :realtime-connected="realtimeConnected"
      @select-project="selectProject"
      @change-view="changeView"
      @open-new-issue="isNewIssueOpen = true"
      @open-omnibar="isOmnibarOpen = true"
      @open-new-project="editingProject = null; isProjectModalOpen = true;"
    ></header-bar>

    <!-- Main View Switcher Area -->
    <main class="flex-1 overflow-hidden relative">
      <!-- 1. Board View -->
      <kanban-board 
        v-if="currentView === 'board'"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        :cycles="cycles"
        :labels="labels"
        :filter-query="filterQuery"
        :filter-priority="filterPriority"
        :filter-cycle="filterCycle"
        @open-issue="openIssue"
        @create-issue="handleCreateIssue"
        @update-issue="handleUpdateIssue"
        @delete-issue="handleDeleteIssue"
      ></kanban-board>

      <!-- 2. List View -->
      <list-view 
        v-else-if="currentView === 'list'"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        :cycles="cycles"
        :labels="labels"
        :filter-query="filterQuery"
        :filter-priority="filterPriority"
        :filter-cycle="filterCycle"
        @open-issue="openIssue"
        @update-issue="handleUpdateIssue"
        @delete-issue="handleDeleteIssue"
        @open-new-issue="isNewIssueOpen = true"
      ></list-view>

      <!-- 3. Cycles / Sprints View -->
      <cycles-view 
        v-else-if="currentView === 'cycles'"
        :cycles="cycles"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        @open-issue="openIssue"
        @open-new-cycle="isCycleModalOpen = true"
      ></cycles-view>

      <!-- 4. Projects Overview -->
      <projects-view 
        v-else-if="currentView === 'projects'"
        :projects="projects"
        :issues="issues"
        @select-project="selectProject"
        @open-new-project="editingProject = null; isProjectModalOpen = true;"
        @delete-project="handleDeleteProject"
        @toggle-favorite="handleToggleFavorite"
      ></projects-view>

      <!-- 5. Analytics View -->
      <stats-view 
        v-else-if="currentView === 'stats'"
        :issues="issues"
        :projects="projects"
        :cycles="cycles"
      ></stats-view>

      <!-- 6. Docs & API View -->
      <docs-view 
        v-else-if="currentView === 'docs'"
      ></docs-view>

      <!-- 7. Plugin Marketplace View -->
      <marketplace-view
        v-else-if="currentView === 'marketplace'"
      ></marketplace-view>
    </main>

    <!-- Issue Detail Slide-Over Drawer -->
    <issue-drawer 
      :issue="selectedIssue"
      :projects="projects"
      :cycles="cycles"
      :labels="labels"
      @close="closeIssueDrawer"
      @update-issue="handleUpdateIssue"
      @delete-issue="handleDeleteIssue"
    ></issue-drawer>

    <!-- Command Palette (Cmd + K Omnibar) -->
    <command-palette 
      :is-open="isOmnibarOpen"
      :issues="issues"
      :projects="projects"
      @close="isOmnibarOpen = false"
      @select-issue="openIssue"
      @select-project="selectProject"
      @change-view="changeView"
      @open-new-issue="isNewIssueOpen = true"
      @open-import="isImportOpen = true"
    ></command-palette>

    <!-- New Issue Modal -->
    <new-issue-modal 
      :is-open="isNewIssueOpen"
      :projects="projects"
      :current-project="currentProject"
      :cycles="cycles"
      :labels="labels"
      @close="isNewIssueOpen = false"
      @create-issue="handleCreateIssue"
    ></new-issue-modal>

    <!-- Import Issues Modal -->
    <import-modal
      :is-open="isImportOpen"
      :projects="projects"
      :current-project="currentProject"
      @close="isImportOpen = false"
      @imported="handleImportComplete"
    ></import-modal>

    <!-- Project Create/Edit Modal -->
    <project-modal 
      :is-open="isProjectModalOpen"
      :edit-project="editingProject"
      @close="isProjectModalOpen = false"
      @save-project="handleSaveProject"
    ></project-modal>

    <!-- Cycle Create Modal -->
    <cycle-modal 
      :is-open="isCycleModalOpen"
      :projects="projects"
      :current-project="currentProject"
      @close="isCycleModalOpen = false"
      @create-cycle="handleCreateCycle"
    ></cycle-modal>

    <!-- Custom Fields Modal -->
    <custom-fields-modal
      :is-open="isCustomFieldsOpen"
      :project="currentProject"
      @close="isCustomFieldsOpen = false"
      @saved="handleCustomFieldsSaved"
    ></custom-fields-modal>

    <!-- Floating Toasts -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none">
      <div 
        v-for="t in toasts" 
        :key="t.id"
        class="px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium border flex items-center space-x-2 animate-in slide-in-from-bottom-2 duration-150 pointer-events-auto"
        :class="{
          'bg-gray-900 border-indigo-500/60 text-indigo-200': t.type === 'info',
          'bg-gray-900 border-emerald-500/60 text-emerald-200': t.type === 'success',
          'bg-gray-900 border-red-500/60 text-red-200': t.type === 'error'
        }"
      >
        <span class="w-2 h-2 rounded-full" :class="{
          'bg-indigo-400': t.type === 'info',
          'bg-emerald-400': t.type === 'success',
          'bg-red-400': t.type === 'error'
        }"></span>
        <span>{{ t.message }}</span>
      </div>
    </div>
    </template>
  </div>

  <!-- Component Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/components/MilkdownEditor.js"></script>
  <script src="/js/components/Header.js"></script>
  <script src="/js/components/KanbanBoard.js"></script>
  <script src="/js/components/ListView.js"></script>
  <script src="/js/components/CyclesView.js"></script>
  <script src="/js/components/MilestonesView.js"></script>
  <script src="/js/components/ProjectsView.js"></script>
  <script src="/js/components/StatsView.js"></script>
  <script src="/js/components/DocsView.js"></script>
  <script src="/js/components/MarketplaceView.js"></script>
  <script src="/js/components/IssueDrawer.js"></script>
  <script src="/js/components/CommandPalette.js"></script>
  <script src="/js/components/NewIssueModal.js"></script>
  <script src="/js/components/ImportModal.js"></script>
  <script src="/js/components/ProjectModal.js"></script>
  <script src="/js/components/CycleModal.js"></script>
  <script src="/js/components/CustomFieldsModal.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
