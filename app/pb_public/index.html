<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectBase — Ultra-lightweight Project & Kanban Management</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('projectbase_theme') || 'dark';
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch(e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2226%22 font-size=%2226%22>⚡</text></svg>" />
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <!-- Static Compiled Tailwind CSS (Tree-shaken & minified) -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- App Custom CSS -->
  <link rel="stylesheet" href="/css/app.css" />

  <!-- Vendor JS Libraries (100% offline self-contained) -->
  <script src="/vendor/pocketbase.umd.js"></script>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/sortable.min.js"></script>
  <script src="/vendor/lucide.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/confetti.min.js"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-800 selection:text-zinc-100 overflow-hidden">
  
  <div id="app" class="h-full flex flex-col">
    <!-- QA Tailwind Probe (ensures verified utilities remain in static CSS) -->
    <div class="hidden pl-7 ml-1.5 mt-1.5 max-h-52 text-sky-300" aria-hidden="true"></div>
    <!-- Auth Gate -->
    <div v-if="!authReady" class="h-full flex items-center justify-center bg-[#0b0f19] text-gray-400 text-sm">Loading session...</div>
    <div v-else-if="!isAuthenticated" class="h-full flex items-center justify-center bg-[#0b0f19] p-6">
      <div class="w-full max-w-sm p-6 rounded-2xl bg-gray-900 border border-gray-800 shadow-2xl">
        <div class="flex items-center space-x-2 mb-6">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">⚡</div>
          <div><h1 class="text-base font-bold text-white">ProjectBase</h1><p class="text-xs text-gray-500">Sign in to your workspace</p></div>
        </div>
        <div v-if="authMode === 'signup'">
          <form @submit.prevent="signUp" class="space-y-3">
            <input v-model="signupName" type="text" autocomplete="name" placeholder="Name (optional)" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="loginEmail" type="email" autocomplete="email" required placeholder="Email" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="loginPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Password (min 8 chars)" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <input v-model="signupPasswordConfirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Confirm password" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <p v-if="authError" class="text-xs text-red-400">{{ authError }}</p>
            <button :disabled="signingUp" class="w-full px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold disabled:opacity-50">
              {{ signingUp ? 'Creating account…' : 'Create account' }}
            </button>
          </form>
          <p class="mt-4 text-[11px] text-gray-500">Already have an account?
            <button type="button" @click="authMode = 'login'" class="text-indigo-400 hover:text-indigo-300 font-semibold">Sign in</button>
          </p>
        </div>
        <form v-else @submit.prevent="signIn" class="space-y-3">
          <input v-model="loginEmail" type="email" autocomplete="email" required placeholder="Email" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
          <input v-model="loginPassword" type="password" autocomplete="current-password" required placeholder="Password" class="w-full px-3 py-2 rounded-lg bg-gray-950 border border-gray-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
          <p v-if="authError" class="text-xs text-red-400">{{ authError }}</p>
          <button class="w-full px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Sign in</button>
        </form>
        <p class="mt-4 text-[11px] text-gray-500">New here?
          <button v-if="authMode === 'login'" type="button" @click="authMode = 'signup'" class="text-indigo-400 hover:text-indigo-300 font-semibold">Create a free account</button>
        </p>
        <p class="mt-2 text-[11px] text-gray-600">Public demos should create a normal user account. Never use the PocketBase superuser for daily work.</p>
      </div>
    </div>

    <template v-else>
    <header-bar
      :projects="projects"
      :current-project="currentProject"
      :current-view="currentView"
      :realtime-connected="realtimeConnected"
      :notifications="notifications"
      :unread-notifications="unreadNotifications"
      :agents="agents"
      :agent-source="agentSource"
      :agent-syncing="agentSyncing"
      :theme="theme"
      @select-project="selectProject"
      @change-view="changeView"
      @open-new-issue="isNewIssueOpen = true"
      @open-omnibar="isOmnibarOpen = true"
      @open-new-project="editingProject = null; isProjectModalOpen = true;"
      @open-custom-fields="isCustomFieldsOpen = true"
      @open-export="isExportOpen = true"
      @open-notification-settings="isNotificationSettingsOpen = true"
      @toggle-notifications="loadNotifications"
      @notification-click="handleNotificationClick"
      @mark-all-read="handleMarkAllNotificationsRead"
      @sync-agents="handleSyncAgents"
      @open-agents="openAgents"
      @toggle-theme="toggleTheme"
    ></header-bar>

    <!-- Offline indicator (Service Worker app shell stays usable offline) -->
    <div v-if="!isOnline" class="flex items-center justify-center gap-2 px-4 py-1.5 bg-amber-500/10 text-amber-300 border-b border-amber-500/20 text-xs font-medium">
      <i data-lucide="wifi-off" class="w-3.5 h-3.5"></i>
      Offline — showing cached data. Edits need a connection; they are not queued.
    </div>

    <!-- Main View Switcher Area -->
    <main class="flex-1 overflow-hidden relative">
      <!-- 1. Board View -->
      <kanban-board 
        v-if="currentView === 'board'"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        :cycles="cycles"
        :labels="labels"
        :agents="agents"
        :selected-issue-ids="selectedIssueIds"
        v-model:filter-query="filterQuery"
        v-model:filter-priority="filterPriority"
        v-model:filter-cycle="filterCycle"
        @open-issue="openIssue"
        @create-issue="handleCreateIssue"
        @update-issue="handleUpdateIssue"
        @delete-issue="handleDeleteIssue"
        @toggle-issue-selection="toggleIssueSelection"
        @range-select-issue="rangeSelectIssue"
      ></kanban-board>

      <!-- 2. List View -->
      <list-view 
        v-else-if="currentView === 'list'"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        :cycles="cycles"
        :labels="labels"
        :agents="agents"
        :selected-issue-ids="selectedIssueIds"
        v-model:filter-query="filterQuery"
        v-model:filter-priority="filterPriority"
        v-model:filter-cycle="filterCycle"
        @open-issue="openIssue"
        @update-issue="handleUpdateIssue"
        @delete-issue="handleDeleteIssue"
        @open-new-issue="isNewIssueOpen = true"
        @toggle-issue-selection="toggleIssueSelection"
        @range-select-issue="rangeSelectIssue"
        @select-all-visible="selectAllVisibleIssues"
      ></list-view>

      <!-- 3. Cycles / Sprints View -->
      <cycles-view 
        v-else-if="currentView === 'cycles'"
        :cycles="cycles"
        :issues="issues"
        :projects="projects"
        :current-project="currentProject"
        v-model:selected-cycle-id="selectedCycleId"
        @open-issue="openIssue"
        @open-new-cycle="isCycleModalOpen = true"
      ></cycles-view>

      <!-- 3b. Timeline / Gantt View -->
      <timeline-view
        v-else-if="currentView === 'timeline'"
        :issues="issues"
        :cycles="cycles"
        :milestones="milestones"
        :projects="projects"
        :current-project="currentProject"
        @open-issue="openIssue"
      ></timeline-view>

      <!-- 4. Projects Overview -->
      <projects-view 
        v-else-if="currentView === 'projects'"
        :projects="projects"
        :issues="issues"
        @select-project="selectProject"
        @open-new-project="editingProject = null; isProjectModalOpen = true;"
        @delete-project="handleDeleteProject"
        @toggle-favorite="handleToggleFavorite"
      ></projects-view>

      <!-- 5. Analytics View -->
      <stats-view 
        v-else-if="currentView === 'stats'"
        :issues="issues"
        :projects="projects"
        :cycles="cycles"
      ></stats-view>

      <!-- 5b. Agent Team View -->
      <agents-view
        v-else-if="currentView === 'agents'"
        :agents="agents"
        :sessions="agentSessions"
        :active-agent-name="activeAgentName"
        :agent-source="agentSource"
        @navigate="navigateAgent"
        @sync-agents="handleSyncAgents"
        @open-new-issue="openNewIssue"
      ></agents-view>

      <!-- 6. Docs & API View -->
      <docs-view 
        v-else-if="currentView === 'docs'"
      ></docs-view>

      <!-- 7. Portfolio Dashboard View -->
      <portfolio-view
        v-else-if="currentView === 'portfolio'"
        :projects="projects"
        :issues="issues"
        :milestones="milestones"
        :realtime-tick="realtimeTick"
        @select-project="selectProject"
      ></portfolio-view>
    </main>

    <!-- Bulk Actions Bar (board/list multi-select) -->
    <div
      v-if="selectedIssueIds.size > 0"
      class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 px-5 py-3 rounded-2xl bg-gray-900/95 backdrop-blur border border-gray-700/80 shadow-2xl shadow-black/60"
    >
      <span class="font-mono text-indigo-300 font-semibold whitespace-nowrap">
        {{ selectedIssueIds.size }} selected
      </span>
      <button
        type="button"
        class="flex items-center gap-1 px-2 py-1 rounded-lg text-gray-400 hover:text-gray-100 hover:bg-gray-800/70 transition-colors"
        title="Clear selection (Esc)"
        @click="clearIssueSelection"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
        <span class="text-[11px]">Clear</span>
      </button>

      <div class="w-px h-5 bg-gray-700/70 hidden sm:block"></div>

      <label class="flex items-center gap-2 text-gray-400">
        <span class="text-[10px] uppercase tracking-wider">Status</span>
        <select
          v-model="bulkStatus"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
          @change="applyBulkField('status', $event.target.value)"
        >
          <option value="" disabled>Set status…</option>
          <option value="backlog">Backlog</option>
          <option value="todo">Todo</option>
          <option value="in_progress">In Progress</option>
          <option value="in_review">In Review</option>
          <option value="done">Done</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </label>

      <label class="flex items-center gap-2 text-gray-400">
        <span class="text-[10px] uppercase tracking-wider">Priority</span>
        <select
          v-model="bulkPriority"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
          @change="applyBulkField('priority', $event.target.value)"
        >
          <option value="" disabled>Set priority…</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
          <option value="none">None</option>
        </select>
      </label>

      <label v-if="cycles.length" class="flex items-center gap-2 text-gray-400">
        <span class="text-[10px] uppercase tracking-wider">Cycle</span>
        <select
          v-model="bulkCycle"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
          @change="applyBulkField('cycle', $event.target.value)"
        >
          <option value="" disabled>Set cycle…</option>
          <option value="">No cycle</option>
          <option v-for="c in cycles" :key="c.id" :value="c.id">{{ c.name }}</option>
        </select>
      </label>

      <div class="w-px h-5 bg-gray-700/70 hidden sm:block"></div>

      <!-- Bulk custom-field picker (per-project schemas from currentProject) -->
      <div v-if="currentFieldDefs.length" class="flex items-center gap-2 text-gray-400">
        <span class="text-[10px] uppercase tracking-wider">Custom</span>
        <select
          v-model="bulkCustomFieldKey"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
        >
          <option value="" disabled>Field…</option>
          <option v-for="f in currentFieldDefs" :key="f.key" :value="f.key">{{ f.label }}</option>
        </select>

        <input
          v-if="selectedBulkCustomField && selectedBulkCustomField.type === 'text'"
          v-model="bulkCustomValue"
          @keydown.enter="bulkCustomFieldKey && applyBulkCustomField(bulkCustomFieldKey, bulkCustomValue)"
          placeholder="Value…"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
        />
        <input
          v-else-if="selectedBulkCustomField && selectedBulkCustomField.type === 'number'"
          v-model.number="bulkCustomValue"
          @keydown.enter="bulkCustomFieldKey && applyBulkCustomField(bulkCustomFieldKey, bulkCustomValue)"
          type="number"
          placeholder="Value…"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 font-mono outline-none focus:border-indigo-500/70 text-xs"
        />
        <select
          v-else-if="selectedBulkCustomField && selectedBulkCustomField.type === 'select'"
          v-model="bulkCustomValue"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 outline-none focus:border-indigo-500/70 text-xs"
        >
          <option value="" disabled>Set…</option>
          <option value="">Clear</option>
          <option v-for="opt in selectedBulkCustomField.options" :key="opt" :value="opt">{{ opt }}</option>
        </select>
        <input
          v-else-if="selectedBulkCustomField && selectedBulkCustomField.type === 'date'"
          v-model="bulkCustomValue"
          type="date"
          class="bg-gray-950/90 border border-gray-700/80 rounded-lg px-2 py-1 text-gray-200 font-mono outline-none focus:border-indigo-500/70 text-xs"
        />
        <label
          v-else-if="selectedBulkCustomField && selectedBulkCustomField.type === 'checkbox'"
          class="flex items-center gap-1.5 text-xs text-gray-300"
        >
          <input type="checkbox" v-model="bulkCustomChecked" class="accent-indigo-500" />
          {{ bulkCustomChecked ? 'Yes' : 'No' }}
        </label>

        <button
          type="button"
          :disabled="!bulkCustomFieldKey || !selectedBulkCustomField"
          class="px-2 py-1 rounded-lg bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
          @click="selectedBulkCustomField.type === 'checkbox'
            ? applyBulkCustomField(bulkCustomFieldKey, bulkCustomChecked)
            : applyBulkCustomField(bulkCustomFieldKey, bulkCustomValue)"
        >
          Apply
        </button>
      </div>

      <div class="w-px h-5 bg-gray-700/70 hidden sm:block"></div>

      <button
        type="button"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-600/90 hover:bg-red-500 text-white text-xs font-semibold transition-colors"
        @click="bulkDeleteSelected"
      >
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>Delete</span>
      </button>
    </div>

    <!-- Issue Detail Slide-Over Drawer -->
    <issue-drawer 
      :issue="selectedIssue"
      :projects="projects"
      :cycles="cycles"
      :labels="labels"
      :milestones="milestones"
      :issues="issues"
      :agents="agents"
      :sessions="agentSessions"
      :field-defs="currentProject ? currentProject.custom_field_defs : []"
      :comment-refresh-key="commentRefreshKey"
      v-model:width-override="drawerWidthOverride"
      @close="closeIssueDrawer"
      @update-issue="handleUpdateIssue"
      @delete-issue="handleDeleteIssue"
      @relations-changed="handleRelationsChanged"
    ></issue-drawer>

    <!-- Command Palette (Cmd + K Omnibar) -->
    <command-palette 
      :is-open="isOmnibarOpen"
      :issues="issues"
      :projects="projects"
      @close="isOmnibarOpen = false"
      @select-issue="openIssue"
      @select-global-issue="openGlobalIssue"
      @select-project="selectProject"
      @change-view="changeView"
      @open-new-issue="isNewIssueOpen = true"
      @open-import="isImportOpen = true"
      @open-export="isExportOpen = true"
      @open-welcome="isOmnibarOpen = false; isWelcomeOpen = true"
    ></command-palette>

    <!-- New Issue Modal -->
    <new-issue-modal
      :is-open="isNewIssueOpen"
      :projects="projects"
      :current-project="currentProject"
      :cycles="cycles"
      :labels="labels"
      :milestones="milestones"
      :agents="agents"
      :pending-issue="pendingNewIssue"
      @close="isNewIssueOpen = false"
      @create-issue="handleCreateIssue"
    ></new-issue-modal>

    <!-- Import Issues Modal -->
    <import-modal
      :is-open="isImportOpen"
      :projects="projects"
      :current-project="currentProject"
      @close="isImportOpen = false"
      @imported="handleImportComplete"
    ></import-modal>

    <!-- Export Issues Modal -->
    <export-modal
      :is-open="isExportOpen"
      :projects="projects"
      :current-project="currentProject"
      @close="isExportOpen = false"
      @exported="handleExportComplete"
    ></export-modal>

    <!-- Notification Channel Settings Modal -->
    <notification-settings-modal
      :is-open="isNotificationSettingsOpen"
      @close="isNotificationSettingsOpen = false"
      @saved="handleNotificationSettingsSaved"
    ></notification-settings-modal>

    <!-- Project Create/Edit Modal -->
    <project-modal 
      :is-open="isProjectModalOpen"
      :edit-project="editingProject"
      @close="isProjectModalOpen = false"
      @save-project="handleSaveProject"
    ></project-modal>

    <!-- Cycle Create Modal -->
    <cycle-modal 
      :is-open="isCycleModalOpen"
      :projects="projects"
      :current-project="currentProject"
      @close="isCycleModalOpen = false"
      @create-cycle="handleCreateCycle"
    ></cycle-modal>

    <!-- Custom Fields Modal -->
    <custom-fields-modal
      :is-open="isCustomFieldsOpen"
      :project="currentProject"
      @close="isCustomFieldsOpen = false"
      @saved="handleCustomFieldsSaved"
    ></custom-fields-modal>

    <!-- First-run Welcome Modal -->
    <welcome-modal
      :is-open="isWelcomeOpen"
      :has-projects="projects.length > 0"
      @close="closeWelcome"
      @create-project="openWelcomeCreateProject"
      @create-issue="openWelcomeCreateIssue"
      @go-board="openWelcomeBoard"
    ></welcome-modal>

    <!-- Floating Toasts -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none">
      <div 
        v-for="t in toasts" 
        :key="t.id"
        class="px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium border flex items-center space-x-2 animate-in slide-in-from-bottom-2 duration-150 pointer-events-auto"
        :class="{
          'bg-gray-900 border-indigo-500/60 text-indigo-200': t.type === 'info',
          'bg-gray-900 border-emerald-500/60 text-emerald-200': t.type === 'success',
          'bg-gray-900 border-red-500/60 text-red-200': t.type === 'error'
        }"
      >
        <span class="w-2 h-2 rounded-full" :class="{
          'bg-indigo-400': t.type === 'info',
          'bg-emerald-400': t.type === 'success',
          'bg-red-400': t.type === 'error'
        }"></span>
        <span>{{ t.message }}</span>
      </div>
    </div>
    </template>
  </div>

  <!-- Component Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/components/SearchableSelect.js"></script>
  <script src="/js/components/Multiselect.js"></script>
  <script src="/js/components/MilkdownEditor.js"></script>
  <script src="/js/components/Header.js"></script>
  <script src="/js/components/KanbanBoard.js"></script>
  <script src="/js/components/ListView.js"></script>
  <script src="/js/components/CyclesView.js"></script>
  <script src="/js/components/MilestonesView.js"></script>
  <script src="/js/components/TimelineView.js"></script>
  <script src="/js/components/ProjectsView.js"></script>
  <script src="/js/components/StatsView.js"></script>
  <script src="/js/components/AgentsView.js"></script>
  <script src="/js/components/PortfolioView.js"></script>
  <script src="/js/components/DocsView.js"></script>
  <script src="/js/components/IssueDrawer.js"></script>
  <script src="/js/components/CommandPalette.js"></script>
  <script src="/js/components/NewIssueModal.js"></script>
  <script src="/js/components/ImportModal.js"></script>
  <script src="/js/components/ExportModal.js"></script>
  <script src="/js/components/ProjectModal.js"></script>
  <script src="/js/components/CycleModal.js"></script>
  <script src="/js/components/CustomFieldsModal.js"></script>
  <script src="/js/components/NotificationSettingsModal.js"></script>
  <script src="/js/components/WelcomeModal.js"></script>
  <script>
    // Offline-first app shell: register the Service Worker (progressive enhancement).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('ProjectBase SW registration failed (non-fatal):', err);
        });
      });
    }
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
