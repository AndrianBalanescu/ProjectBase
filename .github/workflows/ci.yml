name: CI / Build & Health Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install test runner
      run: python -m pip install pytest

    - name: Install PocketBase Binary
      run: |
        chmod +x scripts/install.sh
        ./scripts/install.sh

    - name: Seed protocol superuser
      run: |
        # scripts/start.sh serves the app from ./app with --dir pb_data (i.e.
        # ./app/pb_data). Seed into the SAME data dir the app reads, or the
        # superuser auth fails with 400 and most tests go red.
        mkdir -p app/pb_data
        ./pocketbase superuser upsert \
          "${PB_SUPERUSER_EMAIL:-f@flow.com}" \
          "${PB_SUPERUSER_PASSWORD:-superdev123}" \
          --dir ./app/pb_data

    - name: Start ProjectBase Service in Background
      run: |
        ./scripts/start.sh &
        sleep 3

    - name: Run mechanical proof test suite
      env:
        PROJECTBASE_URL: http://127.0.0.1:8120
      run: python -m pytest -v tests/

  docker:
    name: Docker image build & fresh-container boot
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build ProjectBase image
        run: docker build -t projectbase:ci .

      - name: Boot containerized stack
        run: docker compose up -d

      - name: Seed protocol superuser
        run: |
          # The container serves --dir /app/app/pb_data (see Dockerfile). Seed
          # into the SAME data dir the app reads so superuser auth succeeds.
          docker compose exec -T projectbase /app/pocketbase superuser upsert \
            "${PB_SUPERUSER_EMAIL:-f@flow.com}" \
            "${PB_SUPERUSER_PASSWORD:-superdev123}" \
            --dir /app/app/pb_data

      - name: Health + fresh-boot seed check
        env:
          PB_URL: http://127.0.0.1:8120
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$PB_URL/api/health" >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "$PB_URL/api/health"
          TOKEN=$(curl -fsS -X POST "$PB_URL/api/collections/_superusers/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"${PB_SUPERUSER_EMAIL:-f@flow.com}\",\"password\":\"${PB_SUPERUSER_PASSWORD:-superdev123}\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          TOTAL=$(curl -fsS "$PB_URL/api/collections/projects/records?perPage=1" \
            -H "Authorization: $TOKEN" | python3 -c 'import sys,json; print(json.load(sys.stdin)["totalItems"])')
          echo "Seeded projects on fresh container boot: $TOTAL"
          test "$TOTAL" -ge 1

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
