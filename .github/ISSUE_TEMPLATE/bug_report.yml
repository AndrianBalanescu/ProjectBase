name: Bug report
description: Report a reproducible ProjectBase defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. ProjectBase is alpha software. Search existing issues first and remove all secrets and personal data from your report.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, tokens, private URLs, personal data, and sensitive database content.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
  - type: input
    id: version
    attributes:
      label: ProjectBase version or revision
      description: Release tag or `git rev-parse --short HEAD` output.
      placeholder: v1.x.y or abc1234
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - Native script
        - systemd helper
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host platform
      description: OS, architecture, browser, and browser version when relevant.
      placeholder: Ubuntu 24.04 amd64, Firefox 130
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence, including sanitized configuration when relevant.
      placeholder: |
        1. Start ProjectBase with ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or additional context
      description: Paste only relevant output. Do not upload a production database or expose secrets.
      render: shell
